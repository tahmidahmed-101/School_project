# Generated by `pmo services scaffold school-project`.
# Ports come from registry.json — change them there, not here.

[daemons.api]
run = "./.venv/bin/python manage.py runserver 0.0.0.0:$PORT"
dir = "backend"
port = { expect = [4361], bump = 10 }

[daemons.web]
run = "npm run dev -- --port $PORT"
dir = "frontend"
port = { expect = [3662], bump = 10 }
