# Backend API on the shared edge VPS. Caddy reaches school-project-api by name over the external `edge`
# network; the loopback port (pmo registry.json school-project:api) exists only for the deploy health check.
name: school-project-api

x-api: &api
  build: ./backend
  image: school-project-api:${IMAGE_TAG:-latest}
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgres://schoolproject:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@school-project-db:5432/schoolproject
    MEDIA_ROOT: /app/media
  volumes:
    - media:/app/media
  depends_on:
    db:
      condition: service_healthy
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  db:
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    init: true
    image: postgres:16-alpine
    container_name: school-project-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: schoolproject
      POSTGRES_USER: schoolproject
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolproject -d schoolproject"]
      interval: 30s
      start_period: 30s
      start_interval: 2s
      timeout: 5s
      retries: 5
    networks: [internal]

  api:
    init: true
    <<: *api
    container_name: school-project-api
    ports:
      - "127.0.0.1:4361:4361"
    networks: [internal, edge]

  # Optional (`--profile sweeper`): checkout frees expired holds itself; see scripts/reservation_sweeper.sh.
  sweeper:
    init: true
    <<: *api
    container_name: school-project-sweeper
    profiles: [sweeper]
    command: ["./scripts/reservation_sweeper.sh"]
    networks: [internal]

volumes:
  pgdata:
  media:

networks:
  internal:
  edge:
    external: true
